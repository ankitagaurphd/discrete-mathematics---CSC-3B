<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Propositional & Conditional Logic — Interactive Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EF;
    --panel:#FFFFFF;
    --panel2:#F5ECF9;
    --line:#E5D9EC;
    --text:#463C54;
    --muted:#8F829E;
    --true:#4FAF78;
    --false:#E2707A;
    --amber:#D98E3B;
    --font-d:'Space Grotesk',sans-serif;
    --font-b:'Inter',sans-serif;
    --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-b);overflow:hidden;}
  #deck{position:relative;width:100vw;height:100vh;}
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:70px 8vw 90px 8vw;
    opacity:0;
    transform:translateX(40px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .slide.active{display:flex; opacity:1; transform:translateX(0);}
  .slide.leaving{display:flex; opacity:0; transform:translateX(-40px);}

  .eyebrow{
    font-family:var(--font-m); letter-spacing:.18em; text-transform:uppercase;
    color:var(--amber); font-size:15px; margin-bottom:18px; font-weight:700;
  }
  h1{font-family:var(--font-d); font-size:60px; line-height:1.06; margin:0 0 18px 0; font-weight:700;}
  h2{font-family:var(--font-d); font-size:44px; line-height:1.1; margin:0 0 20px 0; font-weight:700;}
  h3{font-family:var(--font-d); font-size:28px; margin:0 0 10px 0; font-weight:600; color:var(--amber);}
  p.lead{font-size:24px; line-height:1.5; color:var(--text); max-width:900px;}
  .muted{color:var(--muted);}
  .content-wrap{width:100%; max-width:1180px; display:flex; flex-direction:column; align-items:center;}
  .two-col{display:grid; grid-template-columns:1.1fr .9fr; gap:44px; width:100%; max-width:1180px; align-items:center;}
  @media(max-width:1000px){.two-col{grid-template-columns:1fr;}}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:26px 30px;
  }
  .card + .card{margin-top:16px;}

  ul.rules{list-style:none; padding:0; margin:0; width:100%; max-width:850px;}
  ul.rules li{
    display:flex; gap:18px; align-items:flex-start;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:20px 24px; margin-bottom:14px; font-size:20px; line-height:1.45;
  }
  ul.rules li .num{
    font-family:var(--font-m); font-weight:700; color:var(--amber); font-size:22px;
    flex-shrink:0;
  }

  .examples-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:1000px;}
  .ex-card{
    background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--true);
    border-radius:10px; padding:18px 22px; font-size:19px; line-height:1.4;
  }
  .ex-card.false{border-left-color:var(--false);}
  .ex-card .tag{font-family:var(--font-m); font-size:13px; letter-spacing:.05em;}
  .ex-card .tag.T{color:var(--true);}
  .ex-card .tag.F{color:var(--false);}

  table.fail-table{width:100%; max-width:1050px; border-collapse:collapse; font-size:18px;}
  table.fail-table th, table.fail-table td{
    border:1px solid var(--line); padding:14px 18px; text-align:left; line-height:1.4;
  }
  table.fail-table th{background:var(--panel2); font-family:var(--font-m); color:var(--amber); font-size:15px; text-transform:uppercase; letter-spacing:.05em;}
  table.fail-table td{background:var(--panel);}

  .notation-box{
    font-family:var(--font-m); background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:24px 30px; font-size:22px; text-align:center; margin-top:8px;
  }

  table.conn-table{width:100%; max-width:1050px; border-collapse:collapse; font-size:19px;}
  table.conn-table th, table.conn-table td{border:1px solid var(--line); padding:14px 18px; text-align:center;}
  table.conn-table th{background:var(--panel2); color:var(--amber); font-family:var(--font-m); font-size:15px; text-transform:uppercase;}
  table.conn-table td{background:var(--panel);}
  table.conn-table td.name{font-weight:700; text-align:left;}
  table.conn-table td.sym{font-family:var(--font-m); font-size:22px; color:var(--true);}
  table.conn-table td.code{font-family:var(--font-m); color:var(--amber);}

  /* Gate simulator */
  .gate-panel{
    display:flex; align-items:center; justify-content:center; gap:26px;
    background:var(--panel2); border:1px solid var(--line); border-radius:16px;
    padding:26px 34px; margin:18px 0 26px 0; flex-wrap:wrap;
  }
  .toggle{
    font-family:var(--font-m); font-size:22px; font-weight:700; cursor:pointer;
    background:var(--panel); border:2px solid var(--line); color:var(--muted);
    border-radius:12px; padding:14px 22px; min-width:96px; text-align:center;
    transition:all .15s ease; user-select:none;
  }
  .toggle .v{display:block; font-size:14px; margin-top:6px; letter-spacing:.05em;}
  .toggle.on{border-color:var(--true); color:var(--true); background:#EAF6EF; box-shadow:0 0 14px rgba(79,175,120,.25);}
  .toggle.off{border-color:var(--false); color:var(--false); background:#FCEBEC; box-shadow:0 0 14px rgba(226,112,122,.22);}
  .wire{width:46px; height:3px; background:var(--line); position:relative;}
  .wire::after{content:'→'; position:absolute; right:-4px; top:-13px; color:var(--muted); font-size:20px;}
  .led{
    font-family:var(--font-m); font-weight:700; border-radius:12px; padding:14px 26px;
    min-width:160px; text-align:center; border:2px solid var(--line); background:var(--panel);
    color:var(--muted); transition:all .15s ease;
  }
  .led .formula{display:block; font-size:16px; color:var(--muted); margin-bottom:6px;}
  .led .val{font-size:22px;}
  .led.on{border-color:var(--true); color:var(--true); background:#EAF6EF; box-shadow:0 0 18px rgba(79,175,120,.3);}
  .led.off{border-color:var(--false); color:var(--false); background:#FCEBEC; box-shadow:0 0 18px rgba(226,112,122,.28);}
  .hint{font-family:var(--font-m); color:var(--muted); font-size:14px; margin-top:-10px; margin-bottom:18px; letter-spacing:.03em;}

  table.tt{border-collapse:collapse; font-family:var(--font-m); font-size:19px;}
  table.tt th, table.tt td{border:1px solid var(--line); padding:10px 22px; text-align:center;}
  table.tt th{background:var(--panel2); color:var(--amber);}
  table.tt td{background:var(--panel);}
  table.tt tr.hi td{background:#FBEBD3; box-shadow:inset 0 0 0 2px var(--amber);}
  table.tt td.T{color:var(--true); font-weight:700;}
  table.tt td.F{color:var(--false); font-weight:700;}

  .story-cases{list-style:none; padding:0; margin:14px 0 0 0; width:100%; max-width:820px;}
  .story-cases li{
    background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--true);
    border-radius:10px; padding:14px 20px; margin-bottom:10px; font-size:18px; line-height:1.4;
  }
  .story-cases li.false{border-left-color:var(--false);}
  .story-cases li b{font-family:var(--font-m);}

  .badge{
    display:inline-block; font-family:var(--font-m); font-size:13px; letter-spacing:.05em;
    padding:4px 10px; border-radius:6px; margin-left:8px; vertical-align:middle;
  }
  .badge.T{background:rgba(79,175,120,.14); color:var(--true); border:1px solid var(--true);}
  .badge.F{background:rgba(226,112,122,.14); color:var(--false); border:1px solid var(--false);}

  .variation-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; max-width:1100px;}
  @media(max-width:1000px){.variation-grid{grid-template-columns:1fr;}}
  .variation-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px;}
  .variation-card .formula{font-family:var(--font-m); font-size:26px; color:var(--true); margin:10px 0;}

  table.summary-table{width:100%; max-width:1100px; border-collapse:collapse; font-size:17px;}
  table.summary-table th, table.summary-table td{border:1px solid var(--line); padding:12px 16px; text-align:left;}
  table.summary-table th{background:var(--panel2); color:var(--amber); font-family:var(--font-m); font-size:14px; text-transform:uppercase;}
  table.summary-table td{background:var(--panel);}
  table.summary-table td.sym{font-family:var(--font-m); color:var(--true);}

  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px 28px;
    width:100%; max-width:820px; margin-bottom:16px; font-size:19px; line-height:1.5;
  }
  .qcard .qnum{font-family:var(--font-m); color:var(--amber); font-weight:700; margin-right:8px;}

  code.inline{font-family:var(--font-m); background:var(--panel2); padding:2px 8px; border-radius:6px; color:var(--amber);}

  .code-block{
    font-family:var(--font-m); background:#F5EFFB; border:1px solid var(--line); border-radius:12px;
    padding:22px 26px; font-size:18px; line-height:1.6; width:100%; max-width:640px; color:var(--text);
  }
  .code-block .kw{color:#C9646F;}
  .code-block .cm{color:var(--muted);}
  .code-block .fn{color:#5A9BC9;}

  .eq-list{list-style:none; padding:0; margin:0; width:100%; max-width:900px;}
  .eq-list li{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:18px 24px; margin-bottom:14px; font-size:19px;
  }
  .eq-list .eqf{font-family:var(--font-m); color:var(--true); font-size:21px; display:block; margin-top:6px;}

  .steps{list-style:none; counter-reset:step; padding:0; margin:0; width:100%; max-width:820px;}
  .steps li{
    counter-increment:step; position:relative; padding:16px 20px 16px 56px; margin-bottom:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; font-size:18px; line-height:1.45;
  }
  .steps li::before{
    content:counter(step); position:absolute; left:16px; top:14px;
    font-family:var(--font-m); color:var(--amber); font-weight:700; font-size:18px;
  }
  .steps code.inline{font-size:17px;}

  /* nav */
  #nav{position:fixed; bottom:26px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:18px; z-index:10;}
  #nav button{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-family:var(--font-m); font-size:16px; padding:10px 18px; border-radius:8px; cursor:pointer;
  }
  #nav button:hover{border-color:var(--amber); color:var(--amber);}
  #dots{display:flex; gap:6px; max-width:50vw; overflow-x:auto; padding:4px;}
  #dots span{width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0; cursor:pointer;}
  #dots span.active{background:var(--amber); box-shadow:0 0 8px var(--amber);}
  #counter{font-family:var(--font-m); color:var(--muted); font-size:14px; position:fixed; top:20px; right:26px;}
  #progress{position:fixed; top:0; left:0; height:3px; background:var(--amber); z-index:20; transition:width .3s ease;}
</style>
</head>
<body>
<div id="progress"></div>
<div id="counter"></div>
<div id="deck"></div>
<div id="nav">
  <button id="prevBtn">← Prev</button>
  <div id="dots"></div>
  <button id="nextBtn">Next →</button>
</div>

<script>
/* ================= SLIDE CONTENT ================= */
const slides = [];
function S(html){ slides.push(html); }

/* 1 — Title */
S(`
  <div class="two-col" style="align-items:center;">
    <div>
      <div class="eyebrow">Discrete Mathematics · Logic</div>
      <h1>Mathematical Logic</h1>
      <p class="lead" style="font-size:20px; margin-top:-6px;">Dr. Ankita Gaur &nbsp;·&nbsp; Department of Sciences &nbsp;·&nbsp; Manav Rachna University</p>
      <div class="gate-panel" style="justify-content:flex-start; margin-top:22px;">
        <div class="toggle" data-var="p">p<span class="v">?</span></div>
        <div class="wire"></div>
        <div class="toggle" data-var="q">q<span class="v">?</span></div>
        <div class="wire"></div>
        <div class="led" data-gate="cond"><span class="formula">p → q</span><span class="val">?</span></div>
      </div>
      <div class="hint">click p and q to toggle True / False</div>
    </div>
    <div style="display:flex; justify-content:center;">
      <svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
        <circle cx="190" cy="190" r="180" fill="#F5ECF9"/>
        <circle cx="190" cy="190" r="180" fill="none" stroke="#E5D9EC" stroke-width="2"/>
        <!-- input wires -->
        <line x1="30" y1="140" x2="120" y2="140" stroke="#D9CCE6" stroke-width="4"/>
        <line x1="30" y1="240" x2="120" y2="240" stroke="#D9CCE6" stroke-width="4"/>
        <circle cx="30" cy="140" r="9" fill="#4FAF78"/>
        <circle cx="30" cy="240" r="9" fill="#E2707A"/>
        <!-- AND gate body -->
        <path d="M120 90 h60 a100 100 0 0 1 0 200 h-60 z" fill="#FFFFFF" stroke="#D98E3B" stroke-width="4"/>
        <text x="150" y="200" font-family="JetBrains Mono, monospace" font-size="20" fill="#D98E3B" text-anchor="middle">p∧q</text>
        <!-- output wire -->
        <line x1="290" y1="190" x2="350" y2="190" stroke="#D9CCE6" stroke-width="4"/>
        <circle cx="350" cy="190" r="12" fill="#4FAF78"/>
        <circle cx="350" cy="190" r="20" fill="none" stroke="#4FAF78" stroke-width="2" opacity="0.4"/>
        <!-- small floating symbols -->
        <text x="95" y="60" font-family="Space Grotesk, sans-serif" font-size="26" fill="#E2707A" opacity="0.55">¬</text>
        <text x="290" y="330" font-family="Space Grotesk, sans-serif" font-size="26" fill="#4FAF78" opacity="0.55">⊕</text>
        <text x="60" y="320" font-family="Space Grotesk, sans-serif" font-size="26" fill="#D98E3B" opacity="0.55">↔</text>
        <text x="310" y="80" font-family="Space Grotesk, sans-serif" font-size="26" fill="#8F829E" opacity="0.55">→</text>
      </svg>
    </div>
  </div>
`);

/* 2 — What is a proposition */
S(`
  <div class="eyebrow">01 · Introduction to Propositions</div>
  <h2>What is a Proposition?</h2>
  <p class="lead">A proposition is a declarative sentence that is either <b style="color:var(--true)">True</b> or
  <b style="color:var(--false)">False</b> — but never both.</p>
  <div class="content-wrap">
    <div class="card">
      <p style="font-size:20px; line-height:1.5; margin:0;">Think of a proposition as a statement of fact that can be
      tested. If you cannot definitively label the sentence "True" or "False," it is not a proposition.
      True (T) and False (F) are the <b>truth values</b> of the proposition.</p>
    </div>
    <div class="card">
      <p style="font-size:20px; line-height:1.5; margin:0;">In discrete math, we use propositions as the basic
      building blocks to create complex logical arguments.</p>
    </div>
  </div>
`);

/* 2b — Types of Propositions */
S(`
  <div class="eyebrow">01 · Introduction to Propositions</div>
  <h2>Types of Propositions</h2>
  <div class="content-wrap">
    <div class="card" style="border-left:5px solid var(--true);">
      <h3 style="margin-top:0; color:var(--true);">Primitive</h3>
      <p style="font-size:20px; line-height:1.55; margin:0;">A proposition consisting of only a single propositional
      variable or a single propositional constant is called an <b>atomic</b> (primary, primitive) proposition or
      simply proposition — that is, they cannot be further subdivided.</p>
    </div>
    <div class="card" style="border-left:5px solid var(--amber);">
      <h3 style="margin-top:0; color:var(--amber);">Compound</h3>
      <p style="font-size:20px; line-height:1.55; margin:0;">A proposition obtained from the combination of two or
      more propositions by means of logical operators or connectives, or by negating a single proposition, is
      referred to as a <b>molecular</b>, <b>composite</b>, or <b>compound</b> proposition.</p>
    </div>
  </div>
`);

/* 3 — 3 rules */
S(`
  <div class="eyebrow">01 · Introduction to Propositions</div>
  <h2>The 3 Rules of a Proposition</h2>
  <p class="lead" style="font-size:20px;">To qualify as a proposition, a sentence must pass all three of these tests:</p>
  <ul class="rules">
    <li><span class="num">1</span><span><b>It must make a statement</b> — it cannot ask a question or give a command.</span></li>
    <li><span class="num">2</span><span><b>It must be objective</b> — it cannot be a personal opinion or feeling.</span></li>
    <li><span class="num">3</span><span><b>It must be complete</b> — it cannot contain unknown variables that prevent you from knowing if it is true or false.</span></li>
  </ul>
  <div class="card" style="margin-top:18px; max-width:850px; border-left:5px solid var(--amber);">
    <b style="color:var(--amber);">Crucial Note:</b> a statement does <i>not</i> have to be mathematically correct to
    be a proposition. A definitively false statement is still a valid proposition!
  </div>
`);

/* 4 — ARE propositions */
S(`
  <div class="eyebrow">01 · How to Spot a Proposition</div>
  <h2>These <span style="color:var(--true)">ARE</span> Propositions</h2>
  <p class="lead" style="font-size:20px;">These sentences make a definitive claim — we can clearly label them True or False.</p>
  <div class="examples-grid">
    <div class="ex-card"><span class="tag T">PROPOSITION — TRUE</span><br>"New Delhi is the capital of India."</div>
    <div class="ex-card"><span class="tag T">PROPOSITION — TRUE</span><br>"2 + 3 = 5"</div>
    <div class="ex-card false"><span class="tag F">PROPOSITION — FALSE</span><br>"Spiders have exactly three legs." <span class="muted" style="font-size:15px;">(Because we can prove it's false, it still qualifies!)</span></div>
    <div class="ex-card false"><span class="tag F">PROPOSITION — FALSE</span><br>"10 &lt; 4"</div>
  </div>
`);

/* 5 — NOT propositions */
S(`
  <div class="eyebrow">01 · How to Spot a Proposition</div>
  <h2>These are <span style="color:var(--false)">NOT</span> Propositions</h2>
  <table class="fail-table">
    <thead><tr><th>Sentence</th><th>Why it fails</th></tr></thead>
    <tbody>
      <tr><td>"What time is the exam?"</td><td>It is a question. You cannot answer a question with "True."</td></tr>
      <tr><td>"Study hard for your test!"</td><td>It is a command. It is an action, not a statement of fact.</td></tr>
      <tr><td>"Mathematics is the best subject."</td><td>It is an opinion. Subjective — may be true for you but false for someone else.</td></tr>
      <tr><td>"x + 5 = 12"</td><td>Contains an unknown variable. True if x=7, false if x=2. Since we don't know x, we can't judge it.</td></tr>
      <tr><td>"This statement is a lie."</td><td>It's a paradox. If true, it's a lie (false); if false, it's telling the truth. Violates the "never both" rule.</td></tr>
    </tbody>
  </table>
`);

/* 6 — Notation */
S(`
  <div class="eyebrow">01 · Notation and Variables</div>
  <h2>Naming a Proposition</h2>
  <p class="lead">Just like in algebra where we use x and y for unknown numbers, in logic we use lowercase letters
  to represent propositions. The most common letters used are <b style="color:var(--true)">p, q, r, s, t</b>.</p>
  <p class="lead" style="font-size:19px;">Instead of writing out long sentences every time, we define them once:</p>
  <div class="notation-box">
    Let <b>p</b> = "It is raining outside."<br>
    Let <b>q</b> = "I will bring an umbrella."<br><br>
    Now, instead of a paragraph, we simply write&nbsp; <span style="color:var(--true);">p → q</span>
  </div>
  <p class="lead" style="font-size:18px; margin-top:14px;" class="muted">This is how we translate the messy, real world into clean, calculable math!</p>
`);

/* 7 — Connectives table */
S(`
  <div class="eyebrow">02 · Connectives</div>
  <h2>What are Logical Connectives?</h2>
  <p class="lead" style="font-size:19px;">A logical connective is a symbol or word used to connect two or more
  simple propositions together to make a new, more complex proposition.</p>
  <table class="conn-table">
    <thead><tr><th>Name</th><th>English Meaning</th><th>Symbol</th><th>CS Code</th></tr></thead>
    <tbody>
      <tr><td class="name">Negation</td><td>NOT</td><td class="sym">¬p</td><td class="code">!p</td></tr>
      <tr><td class="name">Conjunction</td><td>AND</td><td class="sym">p ∧ q</td><td class="code">p && q</td></tr>
      <tr><td class="name">Disjunction</td><td>OR</td><td class="sym">p ∨ q</td><td class="code">p || q</td></tr>
      <tr><td class="name">Exclusive OR</td><td>XOR</td><td class="sym">p ⊕ q</td><td class="code">p ^ q</td></tr>
      <tr><td class="name">Implication</td><td>IF…THEN</td><td class="sym">p → q</td><td class="code">if(p){q}</td></tr>
      <tr><td class="name">Biconditional</td><td>IFF</td><td class="sym">p ⟺ q</td><td class="code">p === q</td></tr>
    </tbody>
  </table>
`);

/* 8 — Negation */
S(`
  <div class="eyebrow">02 · Connectives — 1. Negation (NOT)</div>
  <h2>¬p — The Exact Opposite</h2>
  <p class="lead" style="font-size:20px;">The Rule: it flips the truth value of a statement. <span class="muted">(also written ~p or !p)</span></p>
  <div class="two-col">
    <div>
      <div class="card">Store sign: <b>p</b> = "The store is open."
        <ul class="story-cases" style="margin-top:14px;">

  <div class="content-wrap">

    Note: an "If… Then…" statement is like a contract or a promise. <b>The contract is only broken if you meet the
    condition, but you are denied the reward.</b> In every other situation, the contract remains perfectly valid!
  </div>
`);

  <p class="lead" style="font-size:19px;">Two compound propositions A and B are logically equivalent (A ≡ B) if
  they have identical truth values in every row of their truth tables.</p>
  <h3 style="margin-top:26px;">Key Equivalences to Remember</h3>
  <ul class="eq-list">
    <li><b>1. Implication Identity</b> — an implication can always be rewritten using NOT and OR.
      <span class="eqf">p → q ≡ ¬p ∨ q</span></li>
    <li><b>2. De Morgan's Laws</b>
      <span class="eqf">¬(p ∧ q) ≡ ¬p ∨ ¬q</span>
      <span class="eqf">¬(p ∨ q) ≡ ¬p ∧ ¬q</span></li>
  </ul>
`);

S(`

  <h2>Breaking Down <code class="inline" style="font-size:26px;">!(is_admin || is_guest)</code></h2>
  <p class="lead" style="font-size:18px;">p = is_admin ("The user is an admin") &nbsp;·&nbsp; q = is_guest ("The user is a guest") &nbsp;·&nbsp; ¬ / ! = "NOT"</p>
  <ol class="steps">
    <li><b>Inside the parentheses (p ∨ q):</b> <code class="inline">is_admin || is_guest</code> → "The user is an admin <b>OR</b> the user is a guest"</li>
    <li><b>Outside the parentheses ¬(p ∨ q):</b> <code class="inline">!(is_admin || is_guest)</code> → "It is <b>NOT</b> true that (the user is an admin OR a guest)"</li>
    <li><b>After De Morgan's Law (¬p ∧ ¬q):</b> <code class="inline">!is_admin && !is_guest</code> → "The user is <b>NOT</b> an admin <b>AND</b> the user is <b>NOT</b> a guest"</li>
  </ol>
`);

/* ================= RENDER ================= */
const deck = document.getElementById('deck');
slides.forEach((html, i)=>{
  const sec = document.createElement('div');
  sec.className = 'slide' + (i===0 ? ' active' : '');
  sec.id = 'slide-'+i;
  sec.innerHTML = html;
  deck.appendChild(sec);
});
const dotsEl = document.getElementById('dots');
slides.forEach((_,i)=>{
  const d = document.createElement('span');
  d.className = i===0 ? 'active' : '';
  d.addEventListener('click', ()=>goTo(i));
  dotsEl.appendChild(d);
});

let current = 0;
function updateChrome(){
  document.getElementById('counter').textContent = (current+1)+' / '+slides.length;
  document.getElementById('progress').style.width = ((current+1)/slides.length*100)+'%';
  [...dotsEl.children].forEach((d,i)=>d.className = i===current ? 'active':'');
}
function goTo(i){
  if(i<0 || i>=slides.length || i===current) return;
  const cur = document.getElementById('slide-'+current);
  const next = document.getElementById('slide-'+i);
  cur.classList.remove('active');
  next.classList.add('active');
  current = i;
  updateChrome();
  initGatesIn(next);
}
document.getElementById('prevBtn').addEventListener('click', ()=>goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});
updateChrome();

/* ================= GATE LOGIC ================= */
const GATES = {
  not:   (p,q)=> !p,
  and:   (p,q)=> p && q,
  or:    (p,q)=> p || q,
  xor:   (p,q)=> p !== q,
  nor:   (p,q)=> !(p||q),
  cond:  (p,q)=> (!p) || q,
  bicond:(p,q)=> p === q
};

function initGatesIn(scope){
  const panels = scope.querySelectorAll('.gate-panel');
  panels.forEach(panel=>{
    const toggles = panel.querySelectorAll('.toggle');
    const led = panel.querySelector('.led');
    const state = {};
    toggles.forEach(t=>{
      const v = t.dataset.var;
      state[v] = null;
      t.addEventListener('click', ()=>{
        state[v] = state[v]===null ? true : !state[v];
        t.classList.toggle('on', state[v]===true);
        t.classList.toggle('off', state[v]===false);
        t.querySelector('.v').textContent = state[v]===true ? 'TRUE' : 'FALSE';
        recompute();
      });
    });
    function recompute(){
      if(!led) return;
      const gateName = led.dataset.gate;
      const needsQ = toggles.length > 1;
      const pv = state.p, qv = state.q;
      const ready = needsQ ? (pv!==null && qv!==null) : (pv!==null);
      const valEl = led.querySelector('.val');
      if(!ready){
        led.classList.remove('on','off');
        valEl.textContent = '?';
        clearHighlight(panel);
        return;
      }
      const result = GATES[gateName](pv, qv===undefined?false:qv);
      led.classList.toggle('on', result===true);
      led.classList.toggle('off', result===false);
      valEl.textContent = result ? 'TRUE' : 'FALSE';
      highlightRow(panel, pv, qv);
    }
  });

  function clearHighlight(panel){
    const scopeEl = panel.closest('.slide') || document;
    scopeEl.querySelectorAll('table.tt tbody tr').forEach(r=>r.classList.remove('hi'));
  }
  function highlightRow(panel, pv, qv){
    const scopeEl = panel.closest('.slide') || document;
    scopeEl.querySelectorAll('table.tt tbody tr').forEach(r=>{
      const rp = r.dataset.p, rq = r.dataset.q;
      const matchP = rp === (pv?'1':'0');
      const matchQ = rq===undefined ? true : (rq === (qv?'1':'0'));
      r.classList.toggle('hi', matchP && matchQ);
    });
  }
}
initGatesIn(document);
</script>
