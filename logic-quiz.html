<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Propositional Logic Quiz</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        /* Student Info Section */
        .student-info { background: #e8f4f8; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #bce8f1; }
        .student-info input { padding: 10px; margin-right: 15px; border-radius: 4px; border: 1px solid #ccc; width: 250px; font-size: 1em; }
        
        .question-block { margin-bottom: 30px; padding: 20px; background: #fafafa; border-left: 4px solid #3498db; border-radius: 4px; }
        .question-text { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .options { list-style: none; padding: 0; }
        .options li { margin-bottom: 12px; padding: 8px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        label { cursor: pointer; display: flex; align-items: center; width: 100%; }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 1em; border-radius: 4px; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .hint-btn { background-color: #f39c12; margin-left: 10px; display: none; }
        .feedback { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        .correct { background-color: #d5f5e3; color: #27ae60; border-left: 4px solid #27ae60; }
        .incorrect { background-color: #fadbd8; color: #c0392b; border-left: 4px solid #c0392b; }
        .hint-text { margin-top: 10px; padding: 12px; background-color: #fef9e7; border-left: 4px solid #f1c40f; display: none; font-style: italic; }
        
        .submit-section { text-align: center; margin-top: 40px; padding: 20px; border-top: 2px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>Propositional Logic Mastery</h1>
    
    <!-- STANDARD HTML FORM TARGETING YOUR NEW WEB APP URL -->
    <form id="quiz-form" action="https://script.google.com/macros/s/AKfycbxp7nTlygQB1ywEPUF1QtWldNO1qP5Hqp5qOsz6nHJV81ptCIqevKdemU8Fhr2nPUo/exec" method="GET" onsubmit="prepareFormData()">
        
        <div class="student-info">
            <h3>Student Details (Required)</h3>
            <input type="text" name="name" id="student-name" placeholder="Full Name" required>
            <input type="text" name="roll" id="student-roll" placeholder="Roll Number" required>
        </div>
        
        <div id="quiz-container"></div>
        
        <!-- Hidden inputs to carry attempt counts -->
        <input type="hidden" name="q1" id="hidden-q1" value="0">
        <input type="hidden" name="q2" id="hidden-q2" value="0">
        <input type="hidden" name="q3" id="hidden-q3" value="0">
        <input type="hidden" name="q4" id="hidden-q4" value="0">
        <input type="hidden" name="q5" id="hidden-q5" value="0">
        <input type="hidden" name="q6" id="hidden-q6" value="0">
        <input type="hidden" name="q7" id="hidden-q7" value="0">
        <input type="hidden" name="q8" id="hidden-q8" value="0">
        <input type="hidden" name="q9" id="hidden-q9" value="0">
        <input type="hidden" name="q10" id="hidden-q10" value="0">

        <div class="submit-section">
            <button type="submit" id="submit-btn" style="background-color: #27ae60; font-size: 1.2em; padding: 15px 30px;">Submit Scores to Teacher</button>
        </div>
    </form>
</div>

<script>
    const quizData = [
        { question: "Q1: Which of the following sentences is a valid proposition?", options: ["A) x + 5 = 10", "B) Please submit your assignment.", "C) 2 + 2 = 5", "D) What time does the lecture start?"], answer: 2, hint: "A proposition must be a declarative statement that is explicitly True or False.", attempts: 0, solved: false },
        { question: "Q2: If p is True and q is False, what is the truth value of &not;(p &and; q) &or; q?", options: ["A) True", "B) False", "C) Depends on third variable", "D) Invalid"], answer: 0, hint: "Evaluate inside the parentheses first: (True AND False).", attempts: 0, solved: false },
        { question: "Q3: In the implication p &rarr; q, under what condition is it logically False?", options: ["A) Both False", "B) p is True, q is False", "C) p is False, q is True", "D) Both True"], answer: 1, hint: "Think of a broken promise: You did the work (True), but didn't get the grade (False).", attempts: 0, solved: false },
        { question: "Q4: A biconditional statement p &harr; q evaluates to True when:", options: ["A) p and q have the exact same truth value.", "B) p is True, regardless of q.", "C) Exactly one is True.", "D) They have opposite values."], answer: 0, hint: "It implies equality (like an XNOR gate).", attempts: 0, solved: false },
        { question: "Q5: By De Morgan's Laws, what is logically equivalent to &not;(p &or; q)?", options: ["A) &not;p &or; &not;q", "B) p &and; q", "C) &not;p &and; &not;q", "D) &not;p &rarr; q"], answer: 2, hint: "Distribute the NOT and flip the OR to an AND.", attempts: 0, solved: false },
        { question: "Q6: What is the converse of 'If the code compiles (p), then it runs (q)'?", options: ["A) If it runs, then it compiles.", "B) If it doesn't compile, it doesn't run.", "C) If it doesn't run, it doesn't compile.", "D) None of the above."], answer: 0, hint: "Converse simply swaps the hypothesis and conclusion.", attempts: 0, solved: false },
        { question: "Q7: What is the inverse of p &rarr; q?", options: ["A) q &rarr; p", "B) &not;p &rarr; &not;q", "C) &not;q &rarr; &not;p", "D) &not;p &or; q"], answer: 1, hint: "Inverse negates both sides but keeps them in the original order.", attempts: 0, solved: false },
        { question: "Q8: A conditional statement is ALWAYS logically equivalent to its:", options: ["A) Converse", "B) Inverse", "C) Contrapositive", "D) Negation"], answer: 2, hint: "Swap the variables AND negate both of them.", attempts: 0, solved: false },
        { question: "Q9: Which is logically equivalent to p &rarr; q?", options: ["A) &not;p &or; q", "B) p &and; &not;q", "C) &not;p &and; q", "D) p &or; &not;q"], answer: 0, hint: "If p is false, the implication is automatically true. If p is true, it relies on q being true.", attempts: 0, solved: false },
        { question: "Q10: If you take the converse of the inverse of p &rarr; q, what do you get?", options: ["A) Original statement", "B) Contrapositive", "C) Negation", "D) Tautology"], answer: 1, hint: "Inverse is &not;p &rarr; &not;q. What happens if you swap those two?", attempts: 0, solved: false }
    ];

    const container = document.getElementById('quiz-container');

    // Render Quiz Questions
    quizData.forEach((q, index) => {
        let optionsHtml = '';
        q.options.forEach((opt, optIndex) => {
            optionsHtml += `<li><label><input type="radio" name="radio_q${index}" value="${optIndex}"> ${opt}</label></li>`;
        });
        container.innerHTML += `
            <div class="question-block" id="block-${index}">
                <div class="question-text">${q.question}</div>
                <ul class="options" id="options-${index}">${optionsHtml}</ul>
                <button type="button" id="check-btn-${index}" onclick="checkAnswer(${index})">Check Answer</button>
                <button type="button" class="hint-btn" id="hint-btn-${index}" onclick="showHint(${index})">Show Hint</button>
                <div class="feedback" id="feedback-${index}"></div>
                <div class="hint-text" id="hint-text-${index}">Hint: ${q.hint}</div>
            </div>`;
    });

    // Check Answer Logic
    function checkAnswer(qIndex) {
        const selected = document.querySelector(`input[name="radio_q${qIndex}"]:checked`);
        if (!selected) { alert("Please select an answer."); return; }

        const qData = quizData[qIndex];
        if (qData.solved) return; 

        qData.attempts += 1;
        const selectedVal = parseInt(selected.value);
        const feedbackEl = document.getElementById(`feedback-${qIndex}`);

        feedbackEl.style.display = "block";

        if (selectedVal === qData.answer) {
            qData.solved = true;
            feedbackEl.innerHTML = `&#10004; Correct! Attempts: ${qData.attempts}`;
            feedbackEl.className = "feedback correct";
            document.getElementById(`hint-btn-${qIndex}`).style.display = "none";
            document.getElementById(`hint-text-${qIndex}`).style.display = "none";
            document.getElementById(`check-btn-${qIndex}`).disabled = true;
            
            const radios = document.querySelectorAll(`input[name="radio_q${qIndex}"]`);
            radios.forEach(radio => radio.disabled = true);
        } else {
            feedbackEl.innerHTML = `&#10008; Incorrect. (Attempt ${qData.attempts})`;
            feedbackEl.className = "feedback incorrect";
            document.getElementById(`hint-btn-${qIndex}`).style.display = "inline-block";
        }
    }

    function showHint(qIndex) {
        document.getElementById(`hint-text-${qIndex}`).style.display = "block";
    }

    // Populate hidden inputs right before form submission
    function prepareFormData() {
        for (let i = 0; i < 10; i++) {
            document.getElementById(`hidden-q${i + 1}`).value = quizData[i].attempts;
        }
    }
</script>

<style>#dm-home{position:fixed;right:14px;bottom:14px;z-index:99999;background:#5b4bdb;color:#fff;padding:10px 13px;border-radius:12px;font:800 12px Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18);text-decoration:none}#dm-home:hover{transform:translateY(-1px)}</style><a id="dm-home" href="index.html">🏠 Portal Home</a><script>(function(){try{let k='dmPortalV5',s=JSON.parse(localStorage.getItem(k)||'{}');s['logicquiz']=true;localStorage.setItem(k,JSON.stringify(s))}catch(e){}})();</script></body>
</html>
